name: local-llm-test
on: workflow_dispatch
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg cmake build-essential
      - run: npm ci && npx playwright install --with-deps chromium
      - run: pip install -r requirements.txt && python -m playwright install chromium
      - uses: actions/cache@v4
        with: {path: models/kokoro, key: kokoro-v1.0}
      - run: |
          mkdir -p models/kokoro
          [ -f models/kokoro/kokoro-v1.0.onnx ] || curl -fL -o models/kokoro/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -f models/kokoro/voices-v1.0.bin ]  || curl -fL -o models/kokoro/voices-v1.0.bin  https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - uses: actions/cache@v4
        with: {path: "~/.cache/huggingface", key: hf-qwen25-3b-v1}
      - name: Local open-source LLM (pip package + model file; no key)
        run: pip install -r requirements-llm.txt
      - name: Write a real storyboard with the local model, validated by the renderer
        run: time python run.py gen "How does a smoke detector detect smoke?"
