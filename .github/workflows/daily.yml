name: daily-video
# Cron every 30 min (UTC). A tiny 'check' job decides if a publishing slot (Israel time, config.yaml schedule.times) is due; only then the render job runs.
# Missed/delayed runs are caught up automatically (up to 3 h late). Manual run: Actions > daily-video > Run workflow (tick "live" to really post; default = draft in Buffer).
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      storyboard: {description: "Optional: bank storyboard id to use (skips the LLM), e.g. microwave", type: string, default: ""}
      heartbeat: {description: "Keep re-triggering itself every ~25 min (self-sustaining; cron is only a backup)", type: boolean, default: false}
      live: {description: "Post for real (unticked = save as draft in Buffer)", type: boolean, default: false}
concurrency:
  group: daily-video
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
env:
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.d.outputs.due }}
      slot: ${{ steps.d.outputs.slot }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml
      - id: d
        env: {FORCE: "${{ github.event_name == 'workflow_dispatch' && inputs.heartbeat != true && '1' || '0' }}"}
        run: python scripts/due.py
  make-and-post:
    needs: check
    if: needs.check.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg cmake build-essential
      - run: npm ci && npx playwright install --with-deps chromium
      - run: pip install -r requirements.txt && python -m playwright install chromium
      - uses: actions/cache@v4
        with: {path: models/kokoro, key: kokoro-v1.0}
      - name: Download voice model (first run only)
        run: |
          mkdir -p models/kokoro
          [ -f models/kokoro/kokoro-v1.0.onnx ] || curl -fL -o models/kokoro/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -f models/kokoro/voices-v1.0.bin ]  || curl -fL -o models/kokoro/voices-v1.0.bin  https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - uses: actions/cache@v4
        if: env.GROQ_API_KEY == '' && env.GEMINI_API_KEY == ''
        with: {path: "~/.cache/huggingface", key: hf-qwen25-3b-v1}
      - name: Local open-source LLM (only if no free API key is set)
        if: env.GROQ_API_KEY == '' && env.GEMINI_API_KEY == ''
        run: pip install -r requirements-llm.txt
      - name: Buffer schema check (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env: {BUFFER_API_KEY: "${{ secrets.BUFFER_API_KEY }}"}
        run: python run.py buffer-check
      - name: Render one video and post it
        env:
          IG_STORAGE_STATE: ${{ secrets.IG_STORAGE_STATE }}
          TT_STORAGE_STATE: ${{ secrets.TT_STORAGE_STATE }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          SLOT: ${{ needs.check.outputs.slot }}
          FORCE_STORYBOARD: ${{ inputs.storyboard }}
          LIVE: ${{ github.event_name == 'workflow_dispatch' && (inputs.live && '1' || '0') || '1' }}
        run: python run.py once
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: video-and-logs, path: "out/videos/*.mp4\nout/logs/*.png", retention-days: 3, if-no-files-found: ignore}
      - name: Save state (which videos were already used)
        if: always()
        run: |
          git config user.name "explainer-bot"; git config user.email "bot@users.noreply.github.com"
          git add state.json && (git diff --cached --quiet || git commit -m "state: update" && git push) || true
  heartbeat:
    # Self-sustaining loop: GitHub's cron is best-effort and may skip runs, so each run re-dispatches the next one after ~25 minutes.
    # Duplicate runs collapse (concurrency group keeps 1 running + 1 pending) and posted slots are tracked in state.json, so nothing is posted twice.
    needs: [check, make-and-post]
    if: always() && (github.event_name == 'schedule' || inputs.heartbeat == true)
    runs-on: ubuntu-latest
    steps:
      - run: sleep 1500
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          for i in 1 2 3 4 5; do gh workflow run daily.yml --repo ${{ github.repository }} -f heartbeat=true -f live=true && exit 0; echo "dispatch failed, retry $i"; sleep 30; done; exit 1
