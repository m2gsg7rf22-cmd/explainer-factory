<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Mont";font-weight:800;src:url(fonts/montserrat-latin-800-normal.woff2)}
@font-face{font-family:"Mont";font-weight:900;src:url(fonts/montserrat-latin-900-normal.woff2)}
html,body{margin:0;background:#04041a;overflow:hidden}
#stage{position:relative;width:720px;height:1280px;overflow:hidden;background:radial-gradient(120% 80% at 50% 30%,#0b0b30,#03030f);font-family:"Mont",Inter,Arial,sans-serif}
#card{position:absolute;left:0;top:0;width:720px;height:1280px;transform-origin:50% 50%;overflow:hidden}
canvas{display:block;width:720px;height:1280px}
#overlay{position:absolute;inset:0;pointer-events:none}
.pill{position:absolute;left:50%;top:63.3%;background:#fff;color:#0a0a1c;font-weight:900;font-size:38px;line-height:1.12;
  padding:14px 24px;border-radius:18px;text-align:center;width:max-content;max-width:610px;box-shadow:0 8px 30px rgba(0,0,0,.35);white-space:normal;text-wrap:balance}
.pill .hl{color:#ff2a3c}
.chip{position:absolute;color:#fff;font-weight:800;font-size:24px;padding:8px 16px;border-radius:14px;white-space:nowrap;
  background:rgba(14,14,58,.72);border:2px solid rgba(255,255,255,.85);box-shadow:0 0 18px rgba(110,100,255,.55);transform-origin:50% 100%}
.chip small{display:block;font-weight:700;font-size:15px;opacity:.7;margin-top:1px}
.stem{position:absolute;width:2px;background:rgba(255,255,255,.8);transform-origin:50% 0}
.stat{position:absolute;left:50%;top:27%;transform:translate(-50%,-50%);text-align:center;color:#fff;font-weight:900;
  background:rgba(14,14,58,.7);border:3px solid rgba(255,255,255,.9);border-radius:22px;padding:14px 30px;box-shadow:0 0 30px rgba(120,110,255,.7)}
.stat b{display:block;font-size:64px;line-height:1.05}
.stat span{display:block;font-size:26px;font-weight:800;opacity:.9;margin-top:2px}
#cta{position:absolute;inset:0;opacity:0}
.fcard{position:absolute;left:50%;top:728px;width:600px;height:118px;transform:translateX(-50%);border-radius:26px;
  background:rgba(20,20,52,.85);border:2px solid rgba(255,255,255,.14);box-shadow:0 0 50px rgba(60,120,255,.35);color:#fff}
.fcard .av{position:absolute;right:16px;top:14px;width:88px;height:88px;border-radius:50%;border:4px solid #8a4dff;background:linear-gradient(135deg,#4f6bff,#9a4dff);
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:38px;overflow:hidden}
.fcard .av img{width:100%;height:100%;object-fit:cover}
.fcard .nm{position:absolute;right:122px;top:24px;font-weight:900;font-size:27px;text-align:right}
.fcard .sub{position:absolute;right:122px;top:62px;font-weight:700;font-size:22px;opacity:.65;text-align:right}
.fcard .btn{position:absolute;left:16px;top:22px;width:150px;height:72px;border-radius:16px;background:linear-gradient(#20b6ff,#0a8cf0);
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:30px;box-shadow:0 0 30px rgba(32,150,255,.7)}
</style></head>
<body>
<div id="stage">
  <div id="card"><canvas id="c" width="720" height="1280"></canvas></div>
  <div id="overlay"><div id="cap" class="pill" style="display:none"></div><div id="labels"></div><div id="stat" class="stat" style="display:none"></div></div>
  <div id="cta"><div class="fcard"><div class="btn">Follow</div><div class="nm" id="ctaName"></div><div class="sub" id="ctaSub"></div><div class="av" id="ctaAv"></div></div>
  <div class="pill" id="ctaPill" style="top:870px;transform:translate(-50%,-50%)"></div></div>
</div>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<script type="module" src="player.js"></script>
</body></html>
